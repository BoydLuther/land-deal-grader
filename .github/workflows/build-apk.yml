name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ParcelGrade.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParcelGrade-apk
          path: ParcelGrade.apk

      - name: Publish APK as a release (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Parcel Grade build ${{ github.run_number }}
          make_latest: true
          files: ParcelGrade.apk
          body: |
            Open this page on your Android phone, tap **ParcelGrade.apk**, then open the download to install.
            If Android asks, allow your browser to "install unknown apps".
